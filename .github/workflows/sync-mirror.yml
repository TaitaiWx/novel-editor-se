name: Sync Release to Mirror

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.0.1-beta.27)'
        required: false

env:
  MIRROR_HOST: ${{ secrets.MIRROR_SSH_HOST }}
  MIRROR_USER: ${{ secrets.MIRROR_SSH_USER }}
  MIRROR_BASE: /var/www/dl.wayintech.net/novel-editor

concurrency:
  group: release-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          SOURCE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$SOURCE_TAG}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag"; exit 1; }
          if [ -n "$INPUT_TAG" ]; then
            # 手动触发：使用输入的 tag
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # workflow_run 触发：从触发分支的 tag 获取
            TAG="$SOURCE_TAG"
            if [ -z "$TAG" ]; then
              echo "::error::Cannot resolve tag from workflow_run event"
              exit 1
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unable to resolve release tag"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || steps.resolve.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          mkdir -p artifacts

          echo "Downloading assets for release: ${TAG}"
          gh release download "${TAG}" --dir artifacts || {
            echo "::error::Failed to download release assets for ${TAG}"
            exit 1
          }

          echo "=== Downloaded files ==="
          ls -lh artifacts/

      - name: Organize by platform and arch
        run: |
          set -euo pipefail
          BASE=mirror-out/latest
          TAG="${{ steps.resolve.outputs.tag }}"

          # Original files: "Novel-Editor-{ver}-{os}-{arch}.{ext}" (already clean)
          # Stable shortcuts: "{os}-{arch}.{ext}" (always point to latest)
          mkdir -p "${BASE}"
          for f in artifacts/*; do
            name=$(basename "$f")
            case "$name" in
              *-mac-arm64.dmg)         cp "$f" "${BASE}/"; cp "$f" "${BASE}/mac-arm64.dmg" ;;
              *-mac-arm64.zip)         cp "$f" "${BASE}/"; cp "$f" "${BASE}/mac-arm64.zip" ;;
              *-mac-x64.dmg)           cp "$f" "${BASE}/"; cp "$f" "${BASE}/mac-x64.dmg" ;;
              *-mac-x64.zip)           cp "$f" "${BASE}/"; cp "$f" "${BASE}/mac-x64.zip" ;;
              *-win-x64.exe)           cp "$f" "${BASE}/"; cp "$f" "${BASE}/win-x64.exe" ;;
              *-win-ia32.exe)          cp "$f" "${BASE}/"; cp "$f" "${BASE}/win-ia32.exe" ;;
              *-win-arm64.exe)         cp "$f" "${BASE}/"; cp "$f" "${BASE}/win-arm64.exe" ;;
              *-linux-x86_64.AppImage) cp "$f" "${BASE}/"; cp "$f" "${BASE}/linux-x64.AppImage" ;;
              *-linux-amd64.deb)       cp "$f" "${BASE}/"; cp "$f" "${BASE}/linux-x64.deb" ;;
              *.blockmap)              ;; # skip blockmaps
              *.yml)                   cp "$f" "${BASE}/" ;;
              *)                       cp "$f" "${BASE}/" ;;
            esac
          done

          # Generate version metadata
          printf '{\n  "version": "%s",\n  "tag": "%s",\n  "date": "%s",\n  "github": "https://github.com/TaitaiWx/novel-editor-se/releases/tag/%s"\n}\n' \
            "${TAG#v}" "${TAG}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${TAG}" \
            > "${BASE}/version.json"

          # Create channel-specific yml copies for pre-release versions.
          # electron-updater looks for "{channel}-mac.yml" based on autoUpdater.channel.
          # electron-builder always generates "latest-*.yml", so we need to copy them
          # to "beta-*.yml" / "alpha-*.yml" to match what the auto-updater expects.
          VERSION="${TAG#v}"
          CHANNEL=""
          case "$VERSION" in
            *-beta.*)  CHANNEL="beta" ;;
            *-alpha.*|*-canary.*) CHANNEL="alpha" ;;
          esac
          if [ -n "$CHANNEL" ]; then
            for yml in "${BASE}"/latest-*.yml "${BASE}/latest.yml"; do
              [ -f "$yml" ] || continue
              ymlname=$(basename "$yml")
              target="${BASE}/${ymlname/latest/$CHANNEL}"
              cp "$yml" "$target"
              echo "Created channel yml: $(basename "$target")"
            done
          fi

          # Immutable rollback release directory: never point a requested old version at /latest.
          RELEASE="mirror-out/releases/${TAG}"
          mkdir -p "$RELEASE"
          cp artifacts/* "$RELEASE/"
          node apps/pc/scripts/create-rollback-manifest.mjs "$RELEASE" "${TAG#v}"

          echo "=== Mirror structure ==="
          find mirror-out -type f | sort

      - name: Deploy to staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MIRROR_SSH_HOST }}
          username: ${{ secrets.MIRROR_SSH_USER }}
          key: ${{ secrets.MIRROR_SSH_KEY }}
          source: mirror-out/*
          target: ${{ env.MIRROR_BASE }}/.staging-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: true

      - name: Atomic swap staging → live
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MIRROR_SSH_HOST }}
          username: ${{ secrets.MIRROR_SSH_USER }}
          key: ${{ secrets.MIRROR_SSH_KEY }}
          script: |
            set -euo pipefail
            BASE="${{ env.MIRROR_BASE }}"

            STAGE="$BASE/.staging-${{ github.run_id }}-${{ github.run_attempt }}"
            TAG="${{ steps.resolve.outputs.tag }}"
            test -d "$STAGE/latest"
            test -f "$STAGE/releases/$TAG/manifest.json"
            mkdir -p "$BASE/releases"

            # On the first migration, preserve the previous live release too.
            if [ -f "$BASE/latest/version.json" ]; then
              PREVIOUS=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^" ]*\)".*/v\1/p' "$BASE/latest/version.json")
              [[ "$PREVIOUS" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
              if [ ! -d "$BASE/releases/$PREVIOUS" ]; then
                cp -a "$BASE/latest" "$STAGE/previous"
                # Historical binaries cannot acknowledge this recovery protocol.
                printf '{"version":"%s","rollbackProtocol":0,"assets":[]}\n' "${PREVIOUS#v}" > "$STAGE/previous/manifest.json"
                mv "$STAGE/previous" "$BASE/releases/$PREVIOUS"
              fi
            fi
            if [ -d "$BASE/releases/$TAG" ]; then
              # Re-runs must not overwrite an existing version with different bytes.
              cmp "$BASE/releases/$TAG/manifest.json" "$STAGE/releases/$TAG/manifest.json"
            else
              mv "$STAGE/releases/$TAG" "$BASE/releases/$TAG"
            fi

            # Preserve untouched channels and the versioned artifacts their metadata references.
            # Incoming release files win; publishing beta must not remove the stable feed.
            if [ -d "$BASE/latest" ]; then cp -an "$BASE/latest/." "$STAGE/latest/"; fi

            # Version archives are permanent; latest remains the forward update feed.
            rm -rf "$BASE/latest.old"
            if [ -d "$BASE/latest" ]; then mv "$BASE/latest" "$BASE/latest.old"; fi
            if ! mv "$STAGE/latest" "$BASE/latest"; then
              [ ! -d "$BASE/latest.old" ] || mv "$BASE/latest.old" "$BASE/latest"
              exit 1
            fi
            rm -rf "$BASE/latest.old" "$STAGE"
            echo "Published immutable $TAG and retained previous releases"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MIRROR_SSH_HOST }}
          username: ${{ secrets.MIRROR_SSH_USER }}
          key: ${{ secrets.MIRROR_SSH_KEY }}
          script: |
            echo "=== Mirror contents ==="
            find ${{ env.MIRROR_BASE }}/latest -type f | sort
            echo ""
            echo "=== Version info ==="
            cat ${{ env.MIRROR_BASE }}/latest/version.json 2>/dev/null || echo "No version.json found"
