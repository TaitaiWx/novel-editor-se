name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NOVEL_EDITOR_STABLE_STAGING_PERCENTAGE: '100'
  NOVEL_EDITOR_BETA_STAGING_PERCENTAGE: '25'
  NOVEL_EDITOR_CANARY_STAGING_PERCENTAGE: '10'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  quality:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify tag matches packaged version
        run: node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("apps/pc/package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== ("v" + version)) throw new Error("Release tag does not match application version");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ut

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin
            arch: x64
            electron-args: --x64
          - os: macos-15
            platform: darwin
            arch: arm64
            electron-args: --arm64
          - os: windows-2025
            platform: win32
            arch: ia32
            electron-args: --ia32
          - os: windows-2025
            platform: win32
            arch: x64
            electron-args: --x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
            electron-args: --arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            electron-args: --x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve release channel
        id: release_channel
        run: node scripts/resolve-release-channel.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Linux smoke-test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libgtk-3-0t64 libxss1 libasound2t64 libgbm1 libsecret-1-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          CI: true

      - name: Rebuild native app deps
        run: pnpm exec electron-rebuild -f -w better-sqlite3 -a ${{ matrix.arch }}
        working-directory: apps/pc

      - name: Native security and recovery tests
        run: >-
          pnpm test:ut --coverage.enabled=false --reporter=default --reporter=junit
          --outputFile.junit=coverage/native.xml
          packages/core/test/workspace-lock.test.ts
          packages/core/test/atomic-text-save.test.ts
          apps/pc/test/main/path-access.test.ts
          apps/pc/test/main/auto-updater/recovery-contract.test.ts
          apps/pc/test/main/auto-updater/recovery-health.test.ts
          apps/pc/test/main/auto-updater/recovery-process.test.ts
          apps/pc/test/main/auto-updater/recovery-windows-process.test.ts
          apps/pc/test/main/auto-updater/recovery-syntax.test.ts
          apps/pc/test/main/provisioning-plist.test.ts
          apps/pc/test/main/packaged-executable.test.ts

      - name: Prepare App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          umask 177
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Build application
        run: pnpm build
        working-directory: apps/pc

      - name: Check bundle architecture and budgets
        run: pnpm check:bundles

      - name: Package Electron app (macOS)
        if: runner.os == 'macOS'
        run: pnpm exec electron-builder ${{ matrix.electron-args }} --config.publish.channel=${{ steps.release_channel.outputs.publish_channel }} --publish never
        working-directory: apps/pc
        env:
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVEL_EDITOR_RELEASE_CHANNEL: ${{ steps.release_channel.outputs.publish_channel }}

      - name: Package Electron app (Windows/Linux)
        if: runner.os != 'macOS'
        run: pnpm exec electron-builder ${{ matrix.electron-args }} --config.publish.channel=${{ steps.release_channel.outputs.publish_channel }} --publish never
        working-directory: apps/pc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVEL_EDITOR_RELEASE_CHANNEL: ${{ steps.release_channel.outputs.publish_channel }}
          # TODO: 申请 Windows 代码签名证书后启用
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Prepare update metadata
        run: node ./scripts/prepare-update-metadata.mjs ./build ${{ steps.release_channel.outputs.publish_channel }}
        working-directory: apps/pc

      # 打包产物烟雾测试已集成为 E2E 用例（apps/pc/e2e/packaged-smoke.e2e.ts），
      # dist 已由打包步骤以生产配置构建，跳过 E2E 的自动构建
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e apps/pc/e2e/packaged-smoke.e2e.ts --reporter=verbose --reporter=junit --outputFile.junit=coverage/e2e.xml
        env:
          NOVEL_EDITOR_E2E_SKIP_BUILD: '1'
          NOVEL_EDITOR_REQUIRE_PACKAGED_SMOKE: '1'

      - name: Smoke test packaged app (macOS/Windows)
        if: runner.os != 'Linux'
        run: pnpm test:e2e apps/pc/e2e/packaged-smoke.e2e.ts --reporter=verbose --reporter=junit --outputFile.junit=coverage/e2e.xml
        env:
          NOVEL_EDITOR_E2E_SKIP_BUILD: '1'
          NOVEL_EDITOR_REQUIRE_PACKAGED_SMOKE: '1'

      - name: Install Windows artifact for shortcut verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'apps/pc/build' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -PassThru
          if (-not $installer.WaitForExit(120000)) { Stop-Process -Id $installer.Id -Force; throw 'Installer timed out' }
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }

      - name: Windows shortcut regression check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Resolve-KnownFolderPath {
            param(
              [string]$specialFolder,
              [string]$fallbackPath
            )

            $resolved = [Environment]::GetFolderPath([System.Environment+SpecialFolder]::$specialFolder)
            if (-not [string]::IsNullOrWhiteSpace($resolved)) {
              return $resolved
            }

            return $fallbackPath
          }

          function Resolve-ShortcutPath {
            param(
              [string]$label,
              [string[]]$candidateDirectories,
              [string]$shortcutName
            )

            $candidatePaths = $candidateDirectories |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique |
              ForEach-Object { Join-Path $_ $shortcutName }

            foreach ($candidatePath in $candidatePaths) {
              if (Test-Path -LiteralPath $candidatePath -PathType Leaf) {
                Write-Host "命中 $label 快捷方式: $candidatePath"
                return $candidatePath
              }
            }

            $checkedPaths = $candidatePaths -join '; '
            throw "未找到快捷方式($label)，已检查: $checkedPaths"
          }

          # 升级后必须保留桌面与开始菜单快捷方式。
          # GitHub Actions Windows runner 可能重定向桌面目录，不能直接硬编码 USERPROFILE\Desktop。
          $desktopDirectory = Resolve-KnownFolderPath `
            -specialFolder 'DesktopDirectory' `
            -fallbackPath (Join-Path $env:USERPROFILE 'Desktop')
          $commonDesktopDirectory = Resolve-KnownFolderPath `
            -specialFolder 'CommonDesktopDirectory' `
            -fallbackPath (Join-Path $env:PUBLIC 'Desktop')
          $programsDirectory = Resolve-KnownFolderPath `
            -specialFolder 'Programs' `
            -fallbackPath (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs')
          $commonProgramsDirectory = Resolve-KnownFolderPath `
            -specialFolder 'CommonPrograms' `
            -fallbackPath (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs')

          $desktopShortcut = Resolve-ShortcutPath `
            -label '桌面' `
            -candidateDirectories @($desktopDirectory, $commonDesktopDirectory) `
            -shortcutName 'Novel Editor.lnk'
          $startMenuShortcut = Resolve-ShortcutPath `
            -label '开始菜单' `
            -candidateDirectories @($programsDirectory, $commonProgramsDirectory) `
            -shortcutName 'Novel Editor.lnk'

          $shortcutPaths = @($desktopShortcut, $startMenuShortcut)
          $shell = New-Object -ComObject WScript.Shell

          foreach ($shortcutPath in $shortcutPaths) {
            $shortcut = $shell.CreateShortcut($shortcutPath)
            $targetPath = $shortcut.TargetPath
            if ([string]::IsNullOrWhiteSpace($targetPath)) {
              throw "快捷方式目标为空: $shortcutPath"
            }
            if (-not (Test-Path -LiteralPath $targetPath -PathType Leaf)) {
              throw "快捷方式目标不存在: $targetPath"
            }
            if (-not $targetPath.ToLowerInvariant().EndsWith('.exe')) {
              throw "快捷方式目标不是可执行文件: $targetPath"
            }
          }

          # 通过快捷方式目标再启动一次，验证目标可执行。
          $targetExe = ($shell.CreateShortcut($desktopShortcut)).TargetPath
          $smokeDataDir = Join-Path $env:RUNNER_TEMP ('shortcut-smoke-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $smokeDataDir | Out-Null

          $env:NOVEL_EDITOR_SMOKE_TEST = '1'
          $env:NOVEL_EDITOR_DISABLE_AUTO_UPDATER = '1'
          $env:NOVEL_EDITOR_SMOKE_TEST_USER_DATA_DIR = $smokeDataDir

          $proc = Start-Process -FilePath $targetExe -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(60000)) {
            Stop-Process -Id $proc.Id -Force
            throw 'Shortcut target did not acknowledge healthy startup before timeout'
          }
          if ($proc.ExitCode -ne 0) { throw "Shortcut target failed: $($proc.ExitCode)" }

          Remove-Item -LiteralPath $smokeDataDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Save platform verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checks-${{ runner.os }}-${{ matrix.arch }}
          path: |
            coverage/native.xml
            coverage/e2e.xml
            apps/pc/e2e/.artifacts/
            apps/pc/dist/bundle-*.json
            apps/pc/build/builder-debug.yml
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Declare rollback compatibility of this binary
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("apps/pc/package.json", "utf8")); fs.writeFileSync("apps/pc/build/rollback-protocol.json", JSON.stringify({version, rollbackProtocol: 1, recoveryProtocol: 1}));'

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: novel-editor-se-release-${{ runner.os }}-${{ matrix.arch }}
          path: |
            apps/pc/build/*.dmg
            apps/pc/build/*.zip
            apps/pc/build/*.exe
            apps/pc/build/*.msi
            apps/pc/build/*.AppImage
            apps/pc/build/*.deb
            apps/pc/build/*.rpm
            apps/pc/build/*.yml
            apps/pc/build/rollback-protocol.json
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve release channel
        id: release_channel
        run: node scripts/resolve-release-channel.mjs

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts-by-job
          pattern: novel-editor-se-release-*
          merge-multiple: false

      - name: Merge and verify release artifacts
        env:
          RELEASE_CHANNEL: ${{ steps.release_channel.outputs.publish_channel }}
        run: node apps/pc/scripts/merge-release-artifacts.mjs artifacts-by-job artifacts "${GITHUB_REF_NAME#v}" "$RELEASE_CHANNEL"

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/**/*
          allowUpdates: false
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          replacesArtifacts: false
          prerelease: ${{ steps.release_channel.outputs.release_type == 'prerelease' }}
          token: ${{ secrets.GITHUB_TOKEN }}
