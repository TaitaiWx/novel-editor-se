name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ut

      - name: Build
        run: pnpm build

  e2e:
    # 真实 Electron GUI 端到端测试（apps/pc/e2e），通过 CDP 驱动，无需 Playwright
    needs: lint-and-build
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libgtk-3-0t64 libxss1 libasound2t64 libgbm1 libxshmfence1 \
            libdrm2 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libsecret-1-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E
        # Linux CI 下 launcher 会自动追加 --no-sandbox（runner 未配置 chrome-sandbox SUID）
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" pnpm test:e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: apps/pc/e2e/.artifacts/
          if-no-files-found: ignore
