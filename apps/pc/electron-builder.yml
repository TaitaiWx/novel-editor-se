appId: com.novel-editor.app
productName: Novel Editor
copyright: Copyright © 2024-2026

directories:
  output: build
  buildResources: resources

electronUpdaterCompatibility: '>=2.16'
generateUpdatesFilesForAllChannels: true
detectUpdateChannel: true
afterAllArtifactBuild: ./scripts/prepare-update-metadata.mjs
# macOS 菜单栏应用名显示为「小说编辑器」：只写入各 lproj 的本地化 InfoPlist.strings，
# 不改 productName / Info.plist 的 CFBundleName（安装路径、更新产物、Helper 查找、userData 均不变）
afterPack: ./scripts/mac-localized-app-name.mjs
npmRebuild: false

artifactName: Novel-Editor-${version}-${os}-${arch}.${ext}
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*

files:
  - dist/**/*
  # Build graph/budget reports are CI diagnostics, not runtime application data.
  - '!dist/bundle-*.json'
  - package.json
  - node_modules/**/*
  - resources/branding/**/*

extraResources:
  # OS-native guardian survives application replacement; contains no Electron runtime.
  - from: recovery
    to: recovery
    filter:
      - guardian.sh
      - guardian.ps1
      - launch.ps1
      - restore.sh
      - publish-mac.sh
  # 示例作品集：排除开发时打开示例留下的本机数据库、会话、写作日志与系统文件
  - from: sample-data
    to: sample-data
    filter:
      - '**/*'
      - '!**/.DS_Store'
      - '!**/Thumbs.db'
      - '!.novel-editor/*.db*'
      - '!.novel-editor/session.json'
      - '!.novel-editor/writing-log.json'
      - '!**/资料/AI实测/**'
  - from: release-notes.json
    to: release-notes.json

mac:
  sign: ./signing/mac-sign.mjs
  icon: resources/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
    - target: zip
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

dmg:
  icon: resources/icon.icns

win:
  icon: resources/icon.ico
  # signDlls: true  # TODO: 申请 Windows 代码签名证书后启用
  target:
    - target: nsis

nsis:
  guid: novel-editor-se
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Novel Editor
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # 自定义安装脚本：安装/升级/卸载前自动关闭旧实例，避免“无法关闭”弹窗
  include: resources/installer.nsh

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
    - target: deb
  category: Office
  maintainer: Novel Editor Team

publish:
  provider: github
  owner: TaitaiWx
  repo: novel-editor-se
# Auto-update configuration
# electron-updater reads this to check for updates on GitHub Releases
# owner/repo are auto-detected from GITHUB_REPOSITORY env var in CI
